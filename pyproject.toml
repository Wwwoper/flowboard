[tool.uv]
package = false

[project]
name = "kanban-tracker"
version = "0.1.0"
description = "Лёгкий self-hosted канбан-трекер для личных проектов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "python-frontmatter>=1.1,<2.0",
  "PyYAML>=6.0,<7.0",
  "markdown-it-py>=3.0,<5.0",
  "bleach>=6.1,<7.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<10.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
